services:
  db:
    image: postgres:16
    container_name: friday-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: friday_db
      POSTGRES_USER: friday_user
      POSTGRES_PASSWORD: friday_password

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friday_user -d friday_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,${LAN_HOST_IP:-192.168.252.132}"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: