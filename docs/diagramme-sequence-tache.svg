<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="800" viewBox="0 0 1180 800">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#58666c"/></marker><style>.title{font:700 29px Arial;fill:#29343a}.actor{fill:#fff3e9;stroke:#ce5d18;stroke-width:2.5}.ext{fill:#fff;stroke:#68777d;stroke-width:2;stroke-dasharray:7 5}.label{font:700 20px Arial;fill:#29343a}.txt{font:18px Arial;fill:#46545b}.line{stroke:#a3adb1;stroke-width:1.6;stroke-dasharray:5 5}.msg{stroke:#56646a;stroke-width:2.5;fill:none;marker-end:url(#a)}.resp{stroke:#748188;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#a)}.event{stroke:#c75a14;stroke-width:2.4;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}.note{fill:#fff7f1;stroke:#e7ae88;stroke-width:1.5}</style></defs>
<rect width="1180" height="800" rx="16" fill="#fff"/><text x="38" y="42" class="title">Séquence — Tâches récupère la cohorte et le groupe, puis notifie un événement</text>
<rect x="28" y="76" width="150" height="66" rx="10" class="actor"/><text x="103" y="104" text-anchor="middle" class="label">Utilisateur</text><text x="103" y="127" text-anchor="middle" class="txt">navigateur</text>
<rect x="238" y="76" width="175" height="66" rx="10" class="actor"/><text x="325" y="104" text-anchor="middle" class="label">Service Tâches</text><text x="325" y="127" text-anchor="middle" class="txt">API backend</text>
<rect x="478" y="76" width="190" height="66" rx="10" class="ext"/><text x="573" y="104" text-anchor="middle" class="label">Identity</text><text x="573" y="127" text-anchor="middle" class="txt">comptes · rôles</text>
<rect x="733" y="76" width="215" height="66" rx="10" class="ext"/><text x="840" y="104" text-anchor="middle" class="label">Cohorte Management</text><text x="840" y="127" text-anchor="middle" class="txt">cohortes · groupes</text>
<rect x="1000" y="76" width="155" height="66" rx="10" class="ext"/><text x="1077" y="104" text-anchor="middle" class="label">Notifications</text><text x="1077" y="127" text-anchor="middle" class="txt">canaux d’envoi</text>
<path d="M103 142V740M325 142V740M573 142V740M840 142V740M1077 142V740" class="line"/>
<path d="M103 190H320" class="msg"/><text x="212" y="180" text-anchor="middle" class="txt">1. GET mes tâches / mon profil + JWT</text>
<path d="M325 248H568" class="msg"/><text x="446" y="238" text-anchor="middle" class="txt">2. Vérifier compte/rôle si requis*</text>
<path d="M573 286H330" class="resp"/><text x="451" y="277" text-anchor="middle" class="txt">3. état du compte, rôles</text>
<path d="M325 345H835" class="msg"/><text x="580" y="335" text-anchor="middle" class="txt">4. GET appartenance par ID Identity stable</text>
<path d="M840 385H330" class="resp"/><text x="585" y="376" text-anchor="middle" class="txt">5. cohort_id/name + group_id/name</text>
<rect x="245" y="425" width="160" height="62" rx="9" class="actor"/><text x="325" y="450" text-anchor="middle" class="label">Assembler réponse</text><text x="325" y="473" text-anchor="middle" class="txt">sans changer la source</text>
<path d="M325 520H108" class="resp"/><text x="216" y="510" text-anchor="middle" class="txt">6. Réponse à l’interface</text>
<rect x="735" y="550" width="420" height="80" rx="10" class="note"/><text x="755" y="580" class="txt">7. Après affectation/achèvement : transmettre un événement</text><text x="755" y="606" class="txt">avec destinataire Identity, task_id et clé de déduplication</text>
<path d="M325 650H1072" class="event"/><text x="700" y="640" text-anchor="middle" class="txt">8. task.assigned / task.completed</text>
<rect x="28" y="670" width="650" height="92" rx="10" fill="#f6f7f7" stroke="#d8dfe1"/><text x="45" y="699" class="txt">* Identity peut émettre un JWT signé avec ID stable et rôles : Tâches valide</text><text x="45" y="724" class="txt">la signature via JWKS ; l’API Identity sert à vérifier l’état/rôle courant si requis.</text><text x="45" y="748" class="txt">Les endpoints sont des exemples de flux, à valider avec chaque équipe.</text></svg>
