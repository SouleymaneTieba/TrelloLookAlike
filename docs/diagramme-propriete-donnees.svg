<path d="M695 150C750 150 752 190 800 190" class="arr"/><path d="M695 335C750 320 758 245 800 230" class="arr"/><path d="M695 515C750 510 760 440 800 440" class="arr"/>
<text x="45" y="615" class="txt">Tâches conserve ses objets et références. Les copies d’identité/cohorte restent minimales, datées et remplaçables.</text></svg>
