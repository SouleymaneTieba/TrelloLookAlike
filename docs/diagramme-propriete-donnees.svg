<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="650" viewBox="0 0 1150 650">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#59666d"/></marker><style>.title{font:700 29px Arial;fill:#29343a}.label{font:700 21px Arial;fill:#29343a}.txt{font:18px Arial;fill:#46545b}.owner{fill:#fff3e9;stroke:#ce5d18;stroke-width:3}.external{fill:#fff;stroke:#63737a;stroke-width:2.5;stroke-dasharray:8 6}.data{fill:#f3f5f5;stroke:#74838a;stroke-width:2}.arr{stroke:#59666d;stroke-width:2.6;fill:none;marker-end:url(#a)}.event{stroke:#c75a14;stroke-width:2.6;fill:none;stroke-dasharray:8 6;marker-end:url(#a)}</style></defs>
<rect width="1150" height="650" rx="16" fill="#fff"/><text x="42" y="45" class="title">Propriété des données et échanges entre les services</text>
<rect x="45" y="150" width="265" height="330" rx="16" class="owner"/><text x="177" y="190" text-anchor="middle" class="label">Service Tâches</text><text x="177" y="220" text-anchor="middle" class="txt">source de vérité des tâches</text><rect x="72" y="250" width="210" height="92" rx="9" fill="#fff" stroke="#e7ae88"/><text x="177" y="283" text-anchor="middle" class="label">Tâches</text><text x="177" y="312" text-anchor="middle" class="txt">contenu · statut · échéance</text><rect x="72" y="368" width="210" height="82" rx="9" class="data"/><text x="177" y="400" text-anchor="middle" class="label">Références externes</text><text x="177" y="428" text-anchor="middle" class="txt">Identity ID · cohort/group IDs</text>
<rect x="410" y="85" width="285" height="130" rx="13" class="external"/><text x="552" y="125" text-anchor="middle" class="label">Identity</text><text x="552" y="155" text-anchor="middle" class="txt">propriétaire : comptes et rôles</text><text x="552" y="184" text-anchor="middle" class="txt">émet ID stable et jeton signé</text>
<rect x="410" y="265" width="285" height="140" rx="13" class="external"/><text x="552" y="305" text-anchor="middle" class="label">Cohorte Management</text><text x="552" y="337" text-anchor="middle" class="txt">propriétaire : cohortes et groupes</text><text x="552" y="368" text-anchor="middle" class="txt">résout identité → appartenances</text>
<rect x="410" y="455" width="285" height="130" rx="13" class="external"/><text x="552" y="495" text-anchor="middle" class="label">Notifications</text><text x="552" y="525" text-anchor="middle" class="txt">propriétaire : préférences/livraison</text><text x="552" y="555" text-anchor="middle" class="txt">e-mail · Telegram · SMS …</text>
<rect x="805" y="130" width="295" height="135" rx="12" class="data"/><text x="952" y="173" text-anchor="middle" class="label">Base du service Tâches</text><text x="952" y="205" text-anchor="middle" class="txt">tâches + IDs externes</text><text x="952" y="235" text-anchor="middle" class="txt">snapshot cohorte daté, facultatif</text>
<rect x="805" y="350" width="295" height="135" rx="12" class="data"/><text x="952" y="393" text-anchor="middle" class="label">Bases séparées</text><text x="952" y="425" text-anchor="middle" class="txt">une par service propriétaire</text><text x="952" y="455" text-anchor="middle" class="txt">aucune FK/base partagée</text>
