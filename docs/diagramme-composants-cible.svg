<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#56646a"/></marker><style>.title{font:700 29px Arial;fill:#29343a}.label{font:700 21px Arial;fill:#29343a}.small{font:18px Arial;fill:#46545b}.current{fill:#fff3e9;stroke:#ce5d18;stroke-width:3}.proposed{fill:#fff;stroke:#55656d;stroke-width:2.5;stroke-dasharray:8 6}.db{fill:#f3f5f5;stroke:#738087;stroke-width:2}.arr{stroke:#56646a;stroke-width:2.7;fill:none;marker-end:url(#a)}.event{stroke:#c75a14;stroke-width:2.7;fill:none;stroke-dasharray:8 7;marker-end:url(#a)}</style></defs>
<rect width="1180" height="760" rx="16" fill="#fff"/><text x="40" y="45" class="title">Architecture cible — Tâches connecté à Identity, Cohorte Management et Notifications</text>
<rect x="35" y="280" width="150" height="105" rx="12" class="current"/><text x="110" y="317" text-anchor="middle" class="label">Navigateur</text><text x="110" y="347" text-anchor="middle" class="small">React / Axios</text>
<rect x="235" y="250" width="180" height="165" rx="12" class="proposed"/><text x="325" y="292" text-anchor="middle" class="label">Passerelle API</text><text x="325" y="322" text-anchor="middle" class="small">si disponible</text><text x="325" y="352" text-anchor="middle" class="small">HTTPS · routage</text><text x="325" y="381" text-anchor="middle" class="small">sinon URL directe</text>
<rect x="465" y="225" width="245" height="205" rx="14" class="current"/><text x="587" y="267" text-anchor="middle" class="label">Service Tâches</text><text x="587" y="298" text-anchor="middle" class="small">Django REST API</text><text x="587" y="326" text-anchor="middle" class="small">JWT · rôles · règles métier</text><text x="587" y="354" text-anchor="middle" class="small">clients HTTP backend</text><text x="587" y="389" text-anchor="middle" class="small">propriétaire des tâches</text>
<rect x="785" y="105" width="205" height="115" rx="12" class="proposed"/><text x="887" y="145" text-anchor="middle" class="label">Identity</text><text x="887" y="174" text-anchor="middle" class="small">comptes · rôles</text><text x="887" y="199" text-anchor="middle" class="small">JWT / JWKS + API</text>
<rect x="785" y="270" width="205" height="135" rx="12" class="proposed"/><text x="887" y="310" text-anchor="middle" class="label">Cohorte Management</text><text x="887" y="341" text-anchor="middle" class="small">cohortes · groupes</text><text x="887" y="370" text-anchor="middle" class="small">appartenance par user ID</text>
<rect x="785" y="455" width="205" height="120" rx="12" class="proposed"/><text x="887" y="496" text-anchor="middle" class="label">Notifications</text><text x="887" y="525" text-anchor="middle" class="small">e-mail · Telegram · SMS</text><text x="887" y="552" text-anchor="middle" class="small">envoi et préférences</text>
<rect x="520" y="515" width="175" height="95" rx="10" class="db"/><text x="607" y="552" text-anchor="middle" class="label">Base Tâches</text><text x="607" y="580" text-anchor="middle" class="small">PostgreSQL</text>
<rect x="785" y="625" width="205" height="70" rx="10" class="proposed"/><text x="887" y="655" text-anchor="middle" class="small">Broker optionnel</text><text x="887" y="679" text-anchor="middle" class="small">si standard existant</text>
<path d="M185 332H231" class="arr"/><text x="208" y="317" text-anchor="middle" class="small">HTTPS</text><path d="M415 332H460" class="arr"/><text x="438" y="317" text-anchor="middle" class="small">REST</text>
<path d="M710 270C740 230 748 178 780 166" class="arr"/><text x="742" y="222" class="small">valider jeton/compte</text>
<path d="M710 326H780" class="arr"/><text x="745" y="310" text-anchor="middle" class="small">GET user→cohorte/groupe</text>
<path d="M710 380C744 421 744 500 780 510" class="event"/><text x="746" y="446" class="small">tâche assignée/terminée</text>
<path d="M587 430V510" class="arr"/>
<path d="M710 398C755 464 742 638 780 654" class="event"/>
<rect x="35" y="645" width="675" height="55" rx="9" fill="#fafbfb" stroke="#d8dfe1"/><text x="52" y="670" class="small">Orange plein : code actuel. Contour pointillé : service externe/intégration à construire.</text><text x="52" y="691" class="small">Chaque service garde sa base ; le navigateur ne détient aucun secret technique.</text>
<text x="40" y="735" class="small">Identity = source des comptes/rôles · Cohorte Management = source des groupes/cohortes · Notifications = livraison multicanale</text></svg>
